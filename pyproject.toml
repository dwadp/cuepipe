[project]
name = "cuepipe"
version = "0.1.0"
description = "Extract text from SRT subtitles, process it through a pipeline (e.g. DeepL translation), and put it back without changing anything else."
readme = "README.md"
authors = [
    { name = "Adi Perdana", email = "dewaadiperdana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepl>=1.32.0",
]

[project.scripts]
cuepipe = "cuepipe:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
